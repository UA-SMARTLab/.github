<svg viewBox="0 0 820 440" aria-label="Animation: an Arduino UNO R4 with the Grove shield, sensors plugged in with cables, and the project running" xmlns="http://www.w3.org/2000/svg" width="820" height="440"><style>
.spark{stroke-dasharray:.08 .92;animation:spark 1.1s linear infinite}@keyframes spark{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.arm{transform-box:fill-box;transform-origin:50% 88%;animation:swing 2.4s ease-in-out infinite}@keyframes swing{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}
.knob{transform-box:fill-box;transform-origin:center;animation:turn 2.4s ease-in-out infinite}@keyframes turn{0%,100%{transform:rotate(-120deg)}50%{transform:rotate(120deg)}}
.cap{transform-box:fill-box;transform-origin:center;animation:press 1.2s ease-in-out infinite}@keyframes press{0%,60%,100%{transform:none}70%,85%{transform:scale(.82)}}
#pixels{animation:hue 3s linear infinite}@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
#lcdBg{animation:lcd 6s linear infinite}@keyframes lcd{0%{fill:#b8d65a}33%{fill:#8fd3f0}66%{fill:#f2b0d8}100%{fill:#b8d65a}}
</style><rect width="820" height="440" rx="18" fill="#ffffff"/>
