<linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#138aa6"/><stop offset="1" stop-color="#0d6b82"/></linearGradient>
<linearGradient id="grove" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6fc4"/><stop offset="1" stop-color="#1d55a0"/></linearGradient>
